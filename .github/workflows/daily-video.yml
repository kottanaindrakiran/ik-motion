name: Daily IK Video

on:
  schedule:
    # 06:30 IST == 01:00 UTC, every day
    - cron: "0 1 * * *"
  workflow_dispatch: {}

# Never let two runs overlap — a new run queues until the current one finishes.
concurrency:
  group: daily-video
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    # A long-day batch renders up to 12 videos (8 shorts + 4 longs) sequentially.
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight — verify required secrets are set
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          missing=""
          [ -z "$GROQ_API_KEY" ]       && missing="$missing GROQ_API_KEY"
          [ -z "$PEXELS_API_KEY" ]     && missing="$missing PEXELS_API_KEY"
          [ -z "$GMAIL_APP_PASSWORD" ] && missing="$missing GMAIL_APP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secret(s):$missing"
            echo "Add them at Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Chrome/Remotion Linux dependencies
        run: |
          # Install each package independently so a renamed/missing package on a
          # newer Ubuntu image can't fail the whole job (Remotion downloads its
          # own Chrome Headless Shell; these are its shared-library deps).
          for pkg in \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 \
            libpango-1.0-0 libcairo2 libasound2t64 libasound2; do
            sudo apt-get install -y "$pkg" || true
          done

      - name: Install Python dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Install Node dependencies (video)
        working-directory: video
        run: npm ci || npm install

      - name: Plan today's videos
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python automation/plan_day.py

      - name: Record advanced state (commit history + day index)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/state.json automation/topic_history.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: advance daily plan state [skip ci]"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main
          fi

      - name: Generate all videos
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python automation/run_batch.py

      - name: Email each finished video
        if: always()
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python automation/email_batch.py

      - name: Upload full-quality videos as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ik-videos-full-quality
          path: output/batch/*.mp4
          retention-days: 7
          if-no-files-found: ignore
